modules:
    - type: dnf
      repos:
        files:
          - https://negativo17.org/repos/fedora-multimedia.repo
      install:
        install-weak-deps: false
        packages:
          - libopenjph
          - heif-pixbuf-loader
          - ffmpeg
          - ffmpeg-libs
          - ffmpegthumbnailer
          - pipewire-libs-extra
          - libfdk-aac
          - gstreamer1-plugins-ugly
      remove:
        packages:
          - gstreamer1-plugins-ugly-free
          - fdk-aac-free
          - ffmpeg-free
          - libavcodec-free  
          - libavdevice-free
          - libavfilter-free
          - libavformat-free  
          - libavutil-free  
          - libpostproc-free  
          - libswresample-free  
          - libswscale-free  
      replace:  
        - from-repo: fedora-multimedia
          packages:
            - libheif
            - libva
            - libva-intel-media-driver
            - intel-gmmlib
            - intel-mediasdk
            - mesa-dri-drivers
            - mesa-filesystem
            - mesa-libEGL
            - mesa-libGL
            - mesa-libgbm
            - mesa-libxatracker
            - mesa-va-drivers
            - mesa-vulkan-drivers
            - gstreamer1-plugin-libav
            - rar

    - type: script
      scripts:
        - removeunusedrepos.sh
